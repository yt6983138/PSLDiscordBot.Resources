<html>
	<head>
		<meta charset="utf-8" />
		<script src="./Common.js"></script>
		<link rel="stylesheet" type="text/css" href="./Common.css" />

		<style>
			:root {
				--ConvertFromWidth: 1920;

				font-size: calc(100vw / var(--ConvertFromWidth));
				overflow-x: hidden;
				overflow-y: hidden;
			}
			body {
				padding: 0%;
				margin: 0%;
				/*background-image: var(--MissingTexture);*/
				background-repeat: no-repeat;
				background-position: center;
				background-size: cover;
			}
			p {
				margin: 0%;
			}

			.white {
				color: white;
			}

			.TextSize12 {
				font-size: 12rem;
			}
			.TextSize16 {
				font-size: 16rem;
			}
			.TextSize22 {
				font-size: 22rem;
			}
			.TextSize32 {
				font-size: 32rem;
			}
			.TextSize36 {
				font-size: 36rem;
			}
			.TextSize52 {
				font-size: 52rem;
			}
			.TextSize64 {
				font-size: 64rem;
			}

			h1 {
				font-size: 60rem;
			}
			p {
				font-size: 14rem;
			}
			#Main {

			}
		</style>
	</head>
	<body>
		<div id="Main"></div>

		<script>
			async function Initialize() {
				await InitializePSLRender();
				window.PLAYER_DATA.ExtraArguments ??= {};

				// this testing file dumps all info passed to this

				let object = { };
				for (const key of ExistingPSLKeys) {
					object[key] = structuredClone(window[key]);
				}

				if (window.PLAYER_DATA.ExtraArguments.TrimGeneratedPlayerData === true) {
					let trimCount = window.PLAYER_DATA.ExtraArguments.TrimMaxRecordCount ?? 35;
					object.PLAYER_DATA.Records = window.PLAYER_DATA.Records.slice(0, trimCount);
					object.INFO.Songs = window.INFO.Songs.filter(x => object.PLAYER_DATA.Records.some(y => y.Score.Id === x.Id));
				}

				let dataSendUrl = window.PLAYER_DATA.ExtraArguments.SendUrl
						?? `http://localhost/upload/${new Date().toLocaleTimeString("sv")}.dump.json`;

				await fetch(dataSendUrl, {
					method: "PUT",
					body: JSON.stringify(object)
				});

				// some rendering (idk what to put)
				const main = document.getElementById("Main");
				main.innerHTML = `
<h1>Testing Render Page</h1>
<p>
Extra arguments: <br/>
${JSON.stringify(object, null, 4)}
</p>
				`;

				window.onload = () => {
					SetReady(true);
				};
			}
			Initialize();
		</script>
	</body>
</html>
